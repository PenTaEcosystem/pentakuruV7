name: Build & Release PentaKuru
on:
  push:
    branches: ["main", "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/Sally/package-lock.json
      - name: Build embedded Sally frontend
        working-directory: vendor/Sally
        run: |
          npm ci
          npm run build
      - name: Check Office bridge Python syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m py_compile src/office/bridge.py
      - name: Check Office bridge Python syntax (Unix)
        if: runner.os != 'Windows'
        run: python3 -m py_compile src/office/bridge.py
      - name: Format check
        run: cargo fmt --check
      - name: Test Full edition (with LibreOffice)
        run: cargo test --locked
      - name: Test Lite edition (without LibreOffice)
        run: cargo test --locked --no-default-features --features lite
      - name: Clippy Full edition
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy Lite edition
        run: cargo clippy --locked --no-default-features --features lite --all-targets -- -D warnings
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco upgrade innosetup -y --no-progress
      - name: Package Windows (Full & Lite + offline Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Setup
      - name: Package macOS / Linux (Full & Lite)
        if: runner.os != 'Windows'
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PentaKuru-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/PentaKuru-*.exe
            dist/PentaKuru-*.zip
            dist/PentaKuru-*.tar.gz
            dist/PentaKuru-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## PentaKuru v0.2.2 — Tách 2 phiên bản Full & Lite · Hỗ trợ macOS · Edge TTS · Nhắc nhở qua AI

          ### Sửa lỗi trong v0.2.2 (Windows)
          - **Mini Music tự chuyển bài (sửa triệt để)**: luồng nhạc web báo thời lượng "không xác định", nên app không nhận ra bài đã hết. Giờ app dùng thời lượng bài từ Penta Music, nên vừa tự chuyển bài vừa hiển thị thanh tiến trình đúng.
          - **Windows 11 không còn nền kính mờ**: tắt lớp nền Mica/Acrylic, viền xám 1px và bo góc của hệ thống trên mọi cửa sổ trong suốt, giữ nguyên giao diện tối giản.

          ### Sửa lỗi trong v0.2.1 (Windows)
          - **Mini Music tự chuyển bài trở lại**: trình phát nhận biết hết bài theo trạng thái phát thay vì sự kiện `MediaEnded` (vốn không bao giờ tới được PowerShell).
          - **Bài hát lỗi không còn bị kẹt**: luồng không mở được sẽ tự bỏ qua sang bài kế tiếp; nếu cả danh sách đều lỗi thì dừng và báo lỗi thay vì lặp vô hạn.
          - **Giọng đọc Edge TTS không còn bị tắt tiếng**: trước đây một bài nhạc lỗi kẹt ở trạng thái "đang mở" khiến app tưởng nhạc vẫn phát và bỏ qua giọng đọc.

          ### Chọn phiên bản phù hợp
          - **`PentaKuru-Setup.exe` (Windows, khuyên dùng)**: Bộ cài offline bản Full, mang sẵn LibreOffice, WebView2 và Visual C++ Runtime — không cần mạng khi cài.
          - **PentaKuru Full** (`PentaKuru-Full-*`): Đầy đủ tất cả tính năng, bao gồm tích hợp **Office / LibreOffice** (Writer, Impress, Calc với AI biên soạn nội dung, tiêu đề, bố cục).
          - **PentaKuru Lite** (`PentaKuru-Lite-*`): Phiên bản gọn nhẹ **không có LibreOffice/Office**, giữ nguyên toàn bộ các tính năng còn lại (Ghi chú & Kanban, Tìm kiếm nhanh, Chat AI, Edge TTS theo chunk, Sửa chính tả, Sally dịch cuộc họp, Penta Music, Penta Clip, Đồng bộ đồng hồ).

          ### Điểm mới nổi bật
          - **Nhắc nhở thông minh hoàn toàn qua AI**: Xóa toàn bộ nút/form cài nhắc nhở thủ công trên UI; chỉ cần nhắn trực tiếp cho AI để thiết lập/đổi/hủy lịch nhắc. Khi người dùng nhắn tin với AI, hệ thống tự động dừng nhắc nhở ngay lập tức.
          - **Thông báo bằng giọng đọc Edge TTS sau khi AI hoàn thành tác vụ**: Phát âm thanh theo từng chunk độ trễ thấp (mặc định Vivienne Multilingual cùng 7 giọng Việt/Đa ngôn ngữ trong Cài đặt).
          - **Loại bỏ hoàn toàn UI-TARS**: Gọn nhẹ hơn, không còn mã nguồn hay thành phần UI-TARS.
          - **Hỗ trợ đầy đủ macOS (Apple Silicon `arm64` & Intel `x86_64`)**: Đóng gói sẵn `.dmg` (kéo-thả vào Applications) và `.tar.gz`, phát Edge TTS & Mini Music trực tiếp qua `afplay`, phát hiện LibreOffice macOS cho bản Full.

          ### Lưu ý khi mở lần đầu trên macOS
          Bản `.dmg` được ký ad-hoc (chưa Apple notarized). Nếu macOS báo nhà phát triển chưa xác minh, nhấp chuột phải vào `PentaKuru Full.app` / `PentaKuru Lite.app` → **Open** (hoặc chạy `xattr -cr "/Applications/PentaKuru Full.app"` trong Terminal).
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PentaKuru ${TAG} (Full & Lite)" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "PentaKuru ${TAG} (Full & Lite)" --notes-file release-notes.md
          fi

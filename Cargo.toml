[package]
name = "pentakuru"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "A monochrome pentagonal desktop companion with notes, search, AI and spell fixing"
license = "GPL-3.0-only"

[workspace]
members = [".", "vendor/Sally/src-tauri"]
default-members = ["."]
resolver = "3"

[features]
default = ["sally-full"]
sally-full = ["dep:sally-source"]

[build-dependencies]
tauri-winres = "0.3.6"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence", "accesskit"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
walkdir = "2"
arboard = "3.6"
ureq = "3"
cpal = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
getrandom = "=0.3.4"

[target.'cfg(target_os = "windows")'.dependencies]
sally-source = { package = "sally", path = "vendor/Sally/src-tauri", optional = true, features = ["embedded", "custom-protocol"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
